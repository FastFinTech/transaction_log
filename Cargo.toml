[workspace]
members = [
    "lib/object-pool",
    "services/transaction-log",
    "services/transaction-log-exports",
]
default-members = ["services/transaction-log"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
crc32c = "0.6"
getset = "0.1.7"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
