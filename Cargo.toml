[workspace]
members = [
    "lib/message-io",
    "lib/object-pool",
    "services/transaction-log",
    "services/transaction-log-exports",
]
default-members = ["services/transaction-log"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
conf = "0.4.5"
crc32c = "0.6"
getset = "0.1.7"
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde"] }
